<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Explorer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/main.css">
</head>

  <header>
    <nav class="navbar navbar-expand-md navbar-dark">
      <div class="container">
        <a class="logo" href="#">Movie Explorer</a>

        <div class="collapse navbar-collapse navbar-menu justify-content-end">
          <form class="form-inline search-form">
            <input class="form-control mr-2 search-input" type="search" placeholder="Search for movies">
            <button class="btn btn-warning" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>
  </header>

    <main class="container py-4">

    <div>
      <div class="alert alert-warning message d-none"></div>

    <div class="text-center spinner-box d-none">
      <div class="spinner-border text-warning"></div>
    </div>

    <div class="row movies"></div>
    </div>
    
    <section class="new-release">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="release-title">New Release</h2>
        <a class="view-all" target="_blank" href="./Pages.html">View all &rsaquo;</a>
      </div>

      <div class="row">
        <div class="col-12 col-md-6 col-lg-3 mb-4">
          <div class="card release-card">
            <img src="./assets/images/love_sky.webp" class="card-img-top" alt="Love in The Night Sky movie">
            <div class="card-body">
              <h3 class="card-title">Love in The Night Sky</h3>

              <div class="release-info d-flex justify-content-between mt-3">
                <div class="release-time">
                  <span>2021</span>
                  <span>.</span>
                  <span>1 hr 35 mins</span>
                </div>
                <div class="release-rating">
                  <span>TV-DA</span>
                </div>
              </div>

              <div class="release-category mt-3">
                <a href="#">Adventure</a>
                <span class="mx-2">.</span>
                <a href="#">Sci-Fi</a>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3 mb-4">
          <div class="card release-card">
            <img src="./assets/images/Faithful-Dog.webp" class="card-img-top" alt="Faithful-Dog movie">
            <div class="card-body">
              <h3 class="card-title">My Faithful Dog</h3>

              <div class="release-info d-flex justify-content-between mt-3">
                <div class="release-time">
                  <span>2022</span>
                  <span>.</span>
                  <span>1 hr 25 mins</span>
                </div>
                <div class="release-rating">
                  <span>TV-MA</span>
                </div>
              </div>

              <div class="release-category mt-3">
                <a href="#">Action</a>
                <span class="mx-2">.</span>
                <a href="#">Romance</a>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3 mb-4">
          <div class="card release-card">
            <img src="./assets/images/WhiteHouse.webp" class="card-img-top" alt="The White House movie">
            <div class="card-body">
              <h3 class="card-title">The White House</h3>

              <div class="release-info d-flex justify-content-between mt-3">
                <div class="release-time">
                  <span>2023</span>
                  <span>.</span>
                  <span>2 hr 35 mins</span>
                </div>
                <div class="release-rating">
                  <span>TV-MA</span>
                </div>
              </div>

              <div class="release-category mt-3">
                <a href="#">Action</a>
                <span class="mx-2">.</span>
                <a href="#">Adventure</a>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3 mb-4">
          <div class="card release-card">
            <img src="./assets/images/Man-in-Black.webp" class="card-img-top" alt="Man in The Black movie">
            <div class="card-body">
              <h3 class="card-title">Man in The Black</h3>

              <div class="release-info d-flex justify-content-between mt-3">
                <div class="release-time">
                  <span>2021</span>
                  <span>.</span>
                  <span>1 hr 45 mins</span>
                </div>
                <div class="release-rating">
                  <span>TV-MA</span>
                </div>
              </div>

              <div class="release-category mt-3">
                <a href="#">Action</a>
                <span class="mx-2">.</span>
                <a href="#">Adventure</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="modal fade movie-modal">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title"></h5>
          </div>
          <div class="modal-body">
            <div class="row">
              <div class="col-md-5 mb-3">
                <img class="img-fluid modal-poster" alt="Poster of the movie">
              </div>
            <div class="col-md-7">
                <p class="badge badge-warning modal-rating"></p>
                <p class="modal-label modal-actors"></p>
                <p class="modal-label modal-plot"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    </section>
  </main>


  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/test.js"></script>
</body>
</html>
